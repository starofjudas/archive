<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="icon" type="image/svg+xml" href="../../../../favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>archive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #000000;
            --color-text: #ffffff;
        }

        body.light-mode {
            --color-bg: #f7f7f7;
            --color-text: #000000;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--color-bg);
            color: var(--color-text);
        }

        /* 갤러리 컨테이너 */
        .gallery-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0;
            scroll-snap-type: none;
        }

        /* 포스터 모드 - 단일 이미지 */
        body.poster-mode .gallery-container {
            overflow: hidden;
            justify-content: center; /* 포스터 모드: 중앙 정렬 */
        }

        body.poster-mode .gallery-wrapper {
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0; /* 포스터 모드에서는 margin 제거 */
        }

        body.poster-mode .gallery-item {
            width: auto;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.poster-mode .gallery-item img {
            width: auto;
            height: auto;
            object-fit: contain;
        }

        /* 포스터 모드 - 세로형 이미지 (높이 80%) */
        body.poster-mode .gallery-item.portrait img {
            height: 80vh;
            width: auto;
        }

        /* 포스터 모드 - 가로형 이미지 (너비 80%) */
        body.poster-mode .gallery-item.landscape img {
            width: 80vw;
            height: auto;
        }

        /* 포스터 모드 - 정사각형 이미지 (높이 80%) */
        body.poster-mode .gallery-item.square img {
            height: 80vh;
            width: auto;
        }

        /* 모바일 포스터 모드 - 모든 방향 브라우저 높이의 50% */
        @media (max-width: 768px) {
            body.poster-mode .gallery-item.portrait img {
                height: 50vh;
                width: auto;
            }

            body.poster-mode .gallery-item.landscape img {
                height: 50vh;
                width: auto;
            }

            body.poster-mode .gallery-item.square img {
                height: 50vh;
                width: auto;
            }
        }

        /* 스크롤바 숨기기 */
        .gallery-container::-webkit-scrollbar {
            display: none;
        }

        .gallery-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 갤러리 래퍼 */
        .gallery-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
            height: 100%;
            padding: 0 20px; /* 첫 번째와 마지막 썸네일의 좌우 마진 */
        }
        
        /* 포스터 모드에서는 중앙 정렬 */
        body.poster-mode .gallery-wrapper {
            justify-content: center;
        }

        /* 갤러리 아이템 */
        .gallery-item {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60vh;
            width: auto;
            aspect-ratio: auto;
            background-color: var(--color-bg);
            scroll-snap-align: none;
        }

        .gallery-item img {
            height: 100%;
            width: auto;
            object-fit: contain;
            display: block;
            cursor: zoom-in;
        }


        /* 모바일: 썸네일 크기를 브라우저 높이의 50%로 변경 */
        @media (max-width: 768px) {
            .gallery-container {
                /* 모바일에서 스크롤이 제대로 작동하도록 */
                -webkit-overflow-scrolling: touch;
                touch-action: pan-x;
            }
            
            .gallery-wrapper {
                padding: 0 20px; /* 모바일에서도 20px 마진 유지 */
            }

            .gallery-item {
                height: 50vh;
                width: auto;
            }

            .gallery-item img {
                height: 100%;
                width: auto;
            }
        }

        /* 브라우저 크기에 따라 마진을 %로 변환 */
        /* 작은 화면: 20px 고정, 큰 화면: % 기반 */
        @media (min-width: 769px) {
            .gallery-wrapper {
                padding: 0 max(20px, 1.25vw);
            }
        }

        @media (min-width: 1025px) {
            .gallery-wrapper {
                padding: 0 max(20px, 1.5vw);
            }
        }

        @media (min-width: 1441px) {
            .gallery-wrapper {
                padding: 0 max(20px, 2vw);
            }
        }
    </style>
</head>
<body>
    <!-- 포스터 모드: 단일 포스터 이미지 표시 -->
    <div class="gallery-container">
        <div class="gallery-wrapper" id="gallery-wrapper">
            <!-- 갤러리 아이템들이 여기에 동적으로 추가됩니다 -->
        </div>
    </div>


    <script>
        // 테마 적용 (홈 화면 테마 동기화)
        function applyTheme() {
            let savedTheme = null;
            
            // 부모 창에서 테마를 받아오기 시도
            try {
                savedTheme = localStorage.getItem('theme');
            } catch (e) {
                // localStorage 접근 불가 시 부모 창에서 받은 테마 사용
                console.log('localStorage 접근 불가, 부모 창 테마 사용');
            }
            
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
            }
        }
        
        // 페이지 로드 시 테마 적용
        applyTheme();
        
        // 테마 변경 감지 (localStorage 변경 감지 - 다른 탭에서의 변경)
        window.addEventListener('storage', (e) => {
            if (e.key === 'theme') {
                applyTheme();
            }
        });
        
        // iframe인 경우 부모 창의 테마 변경 메시지 수신
        if (window.parent !== window) {
            let parentTheme = null;
            
            window.addEventListener('message', (e) => {
                if (e.data && e.data.type === 'themeChange') {
                    parentTheme = e.data.theme;
                    if (parentTheme === 'light') {
                        document.body.classList.add('light-mode');
                    } else {
                        document.body.classList.remove('light-mode');
                    }
                }
            });
            
            // 부모 창에 테마 요청
            window.parent.postMessage({ type: 'requestTheme' }, '*');
            
            // 주기적으로 테마 확인 (같은 탭에서의 변경 감지)
            setInterval(() => {
                applyTheme();
            }, 500);
        }
        
        // 로딩 완료 알림
        function notifyLoaded() {
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'loadingComplete' }, '*');
            }
        }

        // ARCHIVE 브랜드 컬러 팔레트
        const brandColors = {
            primary: '#000000',      // 메인 블랙
            secondary: '#FFFFFF',    // 메인 화이트
            accent: '#FF6B6B',      // 포인트 레드
            gray1: '#1A1A1A',       // 다크 그레이
            gray2: '#333333',       // 미드 그레이
            gray3: '#666666',       // 라이트 그레이
            gray4: '#999999'        // 라이트 그레이 2
        };

        // 썸네일 배경 컬러 팔레트
        const thumbnailBgColors = [
            '#0A0A0A',  // 매우 어두운 블랙
            '#1A1A1A',  // 다크 그레이
            '#0F1419',  // 다크 블루 그레이
            '#1A0F0F',  // 다크 레드 그레이
            '#0F1A0F',  // 다크 그린 그레이
            '#1A1419',  // 다크 퍼플 그레이
            '#19140F',  // 다크 브라운 그레이
            '#0F1919',  // 다크 시안 그레이
            '#19190F',  // 다크 옐로우 그레이
            '#141414'   // 미드 다크 그레이
        ];

        const brandName = 'ARCHIVE';

        // 브랜딩 비율 (일관성 있는 비율)
        const brandAspectRatios = [
            { w: 1, h: 1 },   // 정사각형
            { w: 4, h: 3 },   // 가로형
            { w: 3, h: 4 },   // 세로형
            { w: 16, h: 9 },  // 와이드
            { w: 9, h: 16 },  // 포트레이트
        ];

        // ARCHIVE 브랜딩 가이드 이미지 생성
        function createBrandingImage(width, height, aspectRatio, index) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // 비율에 맞게 크기 조정
            const aspect = aspectRatio.w / aspectRatio.h;
            let imgWidth = width;
            let imgHeight = height;
            
            if (aspect > 1) {
                imgHeight = width / aspect;
            } else {
                imgWidth = height * aspect;
            }
            
            canvas.width = imgWidth;
            canvas.height = imgHeight;
            
            // 배경색 (각 썸네일마다 다른 배경 컬러)
            const bgColor = thumbnailBgColors[index % thumbnailBgColors.length];
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, imgWidth, imgHeight);
            
            // ARCHIVE 브랜딩 가이드 타입별 생성
            const designType = index % 10;
            
            switch(designType) {
                case 0: // 로고 가이드
                    createLogoGuide(ctx, imgWidth, imgHeight);
                    break;
                case 1: // 컬러 팔레트 가이드
                    createColorPaletteGuide(ctx, imgWidth, imgHeight);
                    break;
                case 2: // 타이포그래피 가이드
                    createTypographyGuide(ctx, imgWidth, imgHeight);
                    break;
                case 3: // 그리드 시스템 가이드
                    createGridSystemGuide(ctx, imgWidth, imgHeight);
                    break;
                case 4: // 로고 사용 가이드
                    createLogoUsageGuide(ctx, imgWidth, imgHeight);
                    break;
                case 5: // 스페이싱 가이드
                    createSpacingGuide(ctx, imgWidth, imgHeight);
                    break;
                case 6: // 아이콘 시스템 가이드
                    createIconSystemGuide(ctx, imgWidth, imgHeight);
                    break;
                case 7: // 미니멀 원칙 가이드
                    createMinimalPrincipleGuide(ctx, imgWidth, imgHeight);
                    break;
                case 8: // 브랜드 마크 가이드
                    createBrandMarkGuide(ctx, imgWidth, imgHeight);
                    break;
                case 9: // 전체 아이덴티티 가이드
                    createIdentityGuide(ctx, imgWidth, imgHeight);
                    break;
            }
            
            return canvas.toDataURL('image/png');
        }

        // 1. 로고 가이드
        function createLogoGuide(ctx, w, h) {
            const centerX = w / 2;
            const centerY = h / 2;
            const fontSize = Math.min(w, h) * 0.12;
            
            // 로고 텍스트
            ctx.fillStyle = brandColors.secondary;
            ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(brandName, centerX, centerY - fontSize * 0.2);
            
            // 로고 심볼 (A 문자 기반)
            ctx.strokeStyle = brandColors.accent;
            ctx.lineWidth = fontSize * 0.08;
            ctx.beginPath();
            ctx.moveTo(centerX - fontSize * 0.3, centerY + fontSize * 0.3);
            ctx.lineTo(centerX, centerY - fontSize * 0.3);
            ctx.lineTo(centerX + fontSize * 0.3, centerY + fontSize * 0.3);
            ctx.stroke();
            
            // 가이드 텍스트
            ctx.fillStyle = brandColors.gray3;
            ctx.font = `${fontSize * 0.25}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.fillText('LOGO GUIDE', centerX, h * 0.85);
        }

        // 2. 컬러 팔레트 가이드
        function createColorPaletteGuide(ctx, w, h) {
            const colors = [
                { color: brandColors.primary, name: 'PRIMARY' },
                { color: brandColors.secondary, name: 'WHITE' },
                { color: brandColors.accent, name: 'ACCENT' },
                { color: brandColors.gray2, name: 'GRAY' }
            ];
            
            const rectHeight = h / colors.length;
            const padding = w * 0.05;
            
            colors.forEach((item, i) => {
                ctx.fillStyle = item.color;
                ctx.fillRect(padding, i * rectHeight + padding, w - padding * 2, rectHeight - padding * 2);
                
                // 컬러 이름
                ctx.fillStyle = i === 0 ? brandColors.secondary : brandColors.primary;
                ctx.font = `${Math.min(w, h) * 0.04}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.name, padding * 2, i * rectHeight + rectHeight / 2);
                ctx.fillText(item.color, padding * 2, i * rectHeight + rectHeight / 2 + Math.min(w, h) * 0.05);
            });
        }

        // 3. 타이포그래피 가이드
        function createTypographyGuide(ctx, w, h) {
            const centerX = w / 2;
            const padding = h * 0.1;
            let yPos = padding;
            
            // 헤딩
            ctx.fillStyle = brandColors.secondary;
            ctx.font = `bold ${Math.min(w, h) * 0.1}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(brandName, centerX, yPos);
            yPos += Math.min(w, h) * 0.15;
            
            // 서브헤딩
            ctx.fillStyle = brandColors.gray3;
            ctx.font = `${Math.min(w, h) * 0.06}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.fillText('SUBTITLE TEXT', centerX, yPos);
            yPos += Math.min(w, h) * 0.12;
            
            // 본문
            ctx.fillStyle = brandColors.gray2;
            ctx.font = `${Math.min(w, h) * 0.035}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.fillText('Body text for descriptions', centerX, yPos);
            yPos += Math.min(w, h) * 0.08;
            ctx.fillText('and longer content blocks', centerX, yPos);
            
            // 가이드 라벨
            ctx.fillStyle = brandColors.gray3;
            ctx.font = `${Math.min(w, h) * 0.025}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.fillText('TYPOGRAPHY GUIDE', centerX, h * 0.85);
        }

        // 4. 그리드 시스템 가이드
        function createGridSystemGuide(ctx, w, h) {
            const gridSize = Math.min(w, h) / 12;
            ctx.strokeStyle = brandColors.gray1;
            ctx.lineWidth = 1;
            
            // 그리드 라인
            for (let x = gridSize; x < w; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }
            
            for (let y = gridSize; y < h; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }
            
            // 포인트 영역 표시
            ctx.fillStyle = brandColors.accent;
            ctx.globalAlpha = 0.3;
            ctx.fillRect(gridSize * 2, gridSize * 2, gridSize * 4, gridSize * 4);
            ctx.globalAlpha = 1;
            
            // 가이드 텍스트
            ctx.fillStyle = brandColors.gray3;
            ctx.font = `${Math.min(w, h) * 0.025}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('GRID SYSTEM', w / 2, h * 0.9);
        }

        // 5. 로고 사용 가이드
        function createLogoUsageGuide(ctx, w, h) {
            const centerX = w / 2;
            const centerY = h / 2;
            const fontSize = Math.min(w, h) * 0.08;
            
            // 로고 표시
            ctx.fillStyle = brandColors.secondary;
            ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(brandName, centerX, centerY);
            
            // 사용 영역 표시
            ctx.strokeStyle = brandColors.gray2;
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(centerX - fontSize * 2, centerY - fontSize * 0.6, fontSize * 4, fontSize * 1.2);
            ctx.setLineDash([]);
            
            // 최소 간격 표시
            ctx.strokeStyle = brandColors.gray3;
            ctx.lineWidth = 1;
            const spacing = fontSize * 0.5;
            ctx.strokeRect(centerX - fontSize * 2 - spacing, centerY - fontSize * 0.6 - spacing, fontSize * 4 + spacing * 2, fontSize * 1.2 + spacing * 2);
            
            // 가이드 텍스트
            ctx.fillStyle = brandColors.gray3;
            ctx.font = `${Math.min(w, h) * 0.025}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.fillText('LOGO USAGE', centerX, h * 0.85);
        }

        // 6. 스페이싱 가이드
        function createSpacingGuide(ctx, w, h) {
            const padding = w * 0.1;
            const spacing = Math.min(w, h) * 0.08;
            let xPos = padding;
            const yPos = h / 2;
            
            // 스페이싱 예시
            for (let i = 0; i < 4; i++) {
                ctx.fillStyle = brandColors.accent;
                ctx.fillRect(xPos, yPos - spacing / 2, spacing, spacing);
                
                // 간격 표시
                if (i < 3) {
                    ctx.strokeStyle = brandColors.gray2;
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath();
                    ctx.moveTo(xPos + spacing, yPos);
                    ctx.lineTo(xPos + spacing + spacing * 0.5, yPos);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                
                xPos += spacing * 1.5;
            }
            
            // 가이드 텍스트
            ctx.fillStyle = brandColors.gray3;
            ctx.font = `${Math.min(w, h) * 0.025}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('SPACING GUIDE', w / 2, h * 0.85);
        }

        // 7. 아이콘 시스템 가이드
        function createIconSystemGuide(ctx, w, h) {
            const centerX = w / 2;
            const centerY = h / 2;
            const iconSize = Math.min(w, h) * 0.15;
            const spacing = iconSize * 1.5;
            
            // 아이콘들 표시
            const icons = [
                { type: 'circle', x: centerX - spacing },
                { type: 'square', x: centerX },
                { type: 'triangle', x: centerX + spacing }
            ];
            
            icons.forEach(icon => {
                ctx.strokeStyle = brandColors.accent;
                ctx.fillStyle = brandColors.accent;
                ctx.lineWidth = iconSize * 0.1;
                
                if (icon.type === 'circle') {
                    ctx.beginPath();
                    ctx.arc(icon.x, centerY, iconSize * 0.4, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (icon.type === 'square') {
                    ctx.strokeRect(icon.x - iconSize * 0.4, centerY - iconSize * 0.4, iconSize * 0.8, iconSize * 0.8);
                } else {
                    ctx.beginPath();
                    ctx.moveTo(icon.x, centerY - iconSize * 0.4);
                    ctx.lineTo(icon.x - iconSize * 0.35, centerY + iconSize * 0.3);
                    ctx.lineTo(icon.x + iconSize * 0.35, centerY + iconSize * 0.3);
                    ctx.closePath();
                    ctx.stroke();
                }
            });
            
            // 가이드 텍스트
            ctx.fillStyle = brandColors.gray3;
            ctx.font = `${Math.min(w, h) * 0.025}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('ICON SYSTEM', centerX, h * 0.85);
        }

        // 8. 미니멀 원칙 가이드
        function createMinimalPrincipleGuide(ctx, w, h) {
            const centerX = w / 2;
            const centerY = h / 2;
            
            // 미니멀 라인
            ctx.strokeStyle = brandColors.secondary;
            ctx.lineWidth = Math.min(w, h) * 0.015;
            
            // 수평선
            ctx.beginPath();
            ctx.moveTo(w * 0.2, centerY);
            ctx.lineTo(w * 0.8, centerY);
            ctx.stroke();
            
            // 수직선
            ctx.beginPath();
            ctx.moveTo(centerX, h * 0.2);
            ctx.lineTo(centerX, h * 0.8);
            ctx.stroke();
            
            // 포인트
            ctx.fillStyle = brandColors.accent;
            ctx.beginPath();
            ctx.arc(centerX, centerY, Math.min(w, h) * 0.02, 0, Math.PI * 2);
            ctx.fill();
            
            // 가이드 텍스트
            ctx.fillStyle = brandColors.gray3;
            ctx.font = `${Math.min(w, h) * 0.025}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('MINIMAL PRINCIPLE', centerX, h * 0.85);
        }

        // 9. 브랜드 마크 가이드
        function createBrandMarkGuide(ctx, w, h) {
            const centerX = w / 2;
            const centerY = h / 2;
            const size = Math.min(w, h) * 0.4;
            
            // 브랜드 마크 (A 기반)
            ctx.strokeStyle = brandColors.accent;
            ctx.fillStyle = brandColors.accent;
            ctx.lineWidth = size * 0.08;
            
            // A 형태
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - size * 0.3);
            ctx.lineTo(centerX - size * 0.25, centerY + size * 0.3);
            ctx.lineTo(centerX - size * 0.1, centerY);
            ctx.lineTo(centerX + size * 0.1, centerY);
            ctx.lineTo(centerX + size * 0.25, centerY + size * 0.3);
            ctx.closePath();
            ctx.stroke();
            
            // 가이드 텍스트
            ctx.fillStyle = brandColors.gray3;
            ctx.font = `${Math.min(w, h) * 0.025}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('BRAND MARK', centerX, h * 0.85);
        }

        // 10. 전체 아이덴티티 가이드
        function createIdentityGuide(ctx, w, h) {
            const centerX = w / 2;
            const centerY = h / 2;
            const fontSize = Math.min(w, h) * 0.08;
            
            // 브랜드명
            ctx.fillStyle = brandColors.secondary;
            ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(brandName, centerX, centerY - fontSize * 0.3);
            
            // 서브텍스트
            ctx.fillStyle = brandColors.gray3;
            ctx.font = `${fontSize * 0.4}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.fillText('BRAND IDENTITY', centerX, centerY + fontSize * 0.2);
            
            // 포인트 컬러 표시
            ctx.fillStyle = brandColors.accent;
            ctx.beginPath();
            ctx.arc(centerX, centerY + fontSize * 0.6, fontSize * 0.15, 0, Math.PI * 2);
            ctx.fill();
            
            // 가이드 텍스트
            ctx.fillStyle = brandColors.gray3;
            ctx.font = `${Math.min(w, h) * 0.025}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
            ctx.fillText('IDENTITY GUIDE', centerX, h * 0.85);
        }

        // 모드 감지 (body 클래스, data 속성, 또는 이미지 개수로 구분)
        function getDisplayMode(imageCount) {
            // body에 poster-mode 클래스가 있으면 포스터 모드
            if (document.body.classList.contains('poster-mode')) {
                return 'poster';
            }
            // data-mode 속성으로도 확인 가능
            const dataMode = document.body.getAttribute('data-mode');
            if (dataMode === 'poster') {
                return 'poster';
            }
            // 이미지가 1개만 있으면 자동으로 포스터 모드
            if (imageCount === 1) {
                return 'poster';
            }
            // 기본값은 갤러리 모드
            return 'gallery';
        }

        // 이미지 비율에 따라 클래스 추가
        function getImageOrientation(aspectRatio) {
            const aspect = aspectRatio.w / aspectRatio.h;
            if (aspect > 1) {
                return 'landscape'; // 가로형
            } else if (aspect < 1) {
                return 'portrait'; // 세로형
            } else {
                return 'square'; // 정사각형
            }
        }

        // img 폴더에서 존재하는 이미지 확인 (공통 규칙)
        async function checkAvailableImages() {
            const availableImages = [];
            let index = 1;
            
            // 최대 100개까지 확인 (충분히 큰 범위)
            while (index <= 100) {
                // 두 가지 형식 모두 확인: img01.png, img1.png
                const imagePathPadded = `img/img${String(index).padStart(2, '0')}.png`;
                const imagePathUnpadded = `img/img${index}.png`;
                
                // 패딩된 형식 먼저 확인
                let exists = await checkImageExists(imagePathPadded);
                let imagePath = imagePathPadded;
                
                // 패딩된 형식이 없으면 패딩 없는 형식 확인
                if (!exists) {
                    exists = await checkImageExists(imagePathUnpadded);
                    imagePath = imagePathUnpadded;
                }
                
                if (exists) {
                    availableImages.push(imagePath);
                    index++;
                } else {
                    // 연속된 이미지가 없으면 중단
                    break;
                }
            }
            
            return availableImages;
        }
        
        // 이미지 존재 여부 확인
        function checkImageExists(imagePath) {
            return new Promise((resolve) => {
                const img = new Image();
                let resolved = false;
                
                const timeout = setTimeout(() => {
                    if (!resolved) {
                        resolved = true;
                        resolve(false);
                    }
                }, 2000); // 2초 타임아웃
                
                img.onload = () => {
                    if (!resolved) {
                        resolved = true;
                        clearTimeout(timeout);
                        resolve(true);
                    }
                };
                
                img.onerror = () => {
                    if (!resolved) {
                        resolved = true;
                        clearTimeout(timeout);
                        resolve(false);
                    }
                };
                
                // 이미지가 이미 로드되어 있는 경우 처리
                img.src = imagePath + '?t=' + Date.now(); // 캐시 방지
                
                // 이미 완료된 경우 (캐시된 이미지)
                if (img.complete) {
                    if (img.naturalWidth > 0 && img.naturalHeight > 0) {
                        if (!resolved) {
                            resolved = true;
                            clearTimeout(timeout);
                            resolve(true);
                        }
                    } else {
                        if (!resolved) {
                            resolved = true;
                            clearTimeout(timeout);
                            resolve(false);
                        }
                    }
                }
            });
        }
        
        // 갤러리 렌더링 (공통 규칙 적용)
        async function renderGallery() {
            const galleryWrapper = document.getElementById('gallery-wrapper');
            const isMobile = window.innerWidth <= 768;
            
            // 기본 크기 설정
            const baseHeight = isMobile ? window.innerHeight * 0.5 : window.innerHeight * 0.6;
            const baseWidth = isMobile ? window.innerHeight * 0.5 : baseHeight;
            
            // img 폴더에서 존재하는 이미지 확인
            const availableImages = await checkAvailableImages();
            const totalImages = availableImages.length;
            
            console.log('Available images:', availableImages);
            
            if (totalImages === 0) {
                console.warn('No images found in img folder');
                notifyLoaded();
                return;
            }
            
            // 이미지 개수에 따라 모드 결정 (공통 규칙)
            // 1개만 있으면 포스터 모드, 2개 이상이면 갤러리 모드
            const displayMode = getDisplayMode(totalImages);
            const isPosterMode = displayMode === 'poster';
            
            // 포스터 모드일 경우 body에 클래스 추가
            if (isPosterMode) {
                document.body.classList.add('poster-mode');
            } else {
                document.body.classList.remove('poster-mode');
            }
            
            let loadedCount = 0;
            
            // 존재하는 모든 이미지 로드
            for (let i = 0; i < totalImages; i++) {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                
                const img = document.createElement('img');
                img.src = availableImages[i];
                img.alt = `Image ${i + 1}`;
                
                // 이미지 로드 완료 시 비율 정보 계산
                img.addEventListener('load', function() {
                    // 실제 이미지 비율 계산
                    const naturalAspect = img.naturalWidth / img.naturalHeight;
                    const aspectRatio = { w: img.naturalWidth, h: img.naturalHeight };
                    
                    // 이미지 방향에 따른 클래스 추가
                    const orientation = getImageOrientation(aspectRatio);
                    if (isPosterMode) {
                        item.classList.add(orientation);
                    }
                    
                    // 비율 정보를 data 속성에 저장
                    item.setAttribute('data-aspect', naturalAspect);
                    item.setAttribute('data-orientation', orientation);
                    
                    // 배경 컬러 적용
                    const bgColor = thumbnailBgColors[i % thumbnailBgColors.length];
                    item.style.backgroundColor = bgColor;
                    
                    // 모드에 따라 크기 설정
                    if (isPosterMode) {
                        // 포스터 모드: CSS에서 처리하므로 스타일 제거
                        item.style.width = 'auto';
                        item.style.height = 'auto';
                    } else {
                        // 갤러리 모드: CSS에서 정의한 높이 유지 (60vh 또는 50vh)
                        // JavaScript에서 스타일을 명시적으로 설정하지 않음
                        item.style.width = '';
                        item.style.height = '';
                    }
                    
                    loadedCount++;
                    if (loadedCount === totalImages) {
                        // 모든 이미지 로드 완료 후 갤러리 모드일 경우 초기 스크롤 위치를 중앙으로 설정
                        if (!isPosterMode) {
                            centerGalleryOnLoad();
                        }
                        notifyLoaded();
                    }
                });
                
                // 이미지 로드 실패 처리
                img.addEventListener('error', () => {
                    console.warn(`Failed to load ${availableImages[i]}`);
                    loadedCount++;
                    if (loadedCount === totalImages) {
                        // 모든 이미지 로드 완료 후 갤러리 모드일 경우 초기 스크롤 위치를 중앙으로 설정
                        if (!isPosterMode) {
                            centerGalleryOnLoad();
                        }
                        notifyLoaded();
                    }
                });
                
                // 이미지 클릭 시 확대 기능
                img.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const orientation = item.getAttribute('data-orientation') || 'portrait';
                    openImageZoom(img.src, orientation);
                });
                
                item.appendChild(img);
                galleryWrapper.appendChild(item);
            }
        }

        // 이미지 확대 기능 - 부모 창(page.html)에 메시지 전송
        function openImageZoom(imageSrc, orientation) {
            if (window.parent !== window) {
                // iframe인 경우 부모 창에 메시지 전송
                window.parent.postMessage({ 
                    type: 'openImageZoom', 
                    imageSrc: imageSrc,
                    orientation: orientation || 'portrait'
                }, '*');
            } else {
                // 직접 열린 경우 (개발용)
                const overlay = document.getElementById('image-zoom-overlay');
                const zoomedImage = document.getElementById('zoomed-image');
                
                if (overlay && zoomedImage) {
                    zoomedImage.src = imageSrc;
                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            }
        }


        // 갤러리 모드에서 초기 스크롤 위치 설정
        function centerGalleryOnLoad() {
            const galleryContainer = document.querySelector('.gallery-container');
            const galleryWrapper = document.querySelector('.gallery-wrapper');
            
            if (!galleryContainer || !galleryWrapper || document.body.classList.contains('poster-mode')) {
                return;
            }
            
            const isMobile = window.innerWidth <= 768;
            const isTablet = window.innerWidth > 768 && window.innerWidth <= 1024;
            const isMobileOrTablet = isMobile || isTablet;
            
            // 이미지 개수에 따라 대기 시간 조정 (이미지가 많을수록 더 긴 대기 시간 필요)
            const imageItems = galleryWrapper.querySelectorAll('.gallery-item');
            const imageCount = imageItems.length;
            const baseDelay = 500;
            const additionalDelay = Math.min(imageCount * 50, 1000); // 이미지당 50ms, 최대 1초 추가
            const totalDelay = baseDelay + additionalDelay;
            
            // 레이아웃이 안정화될 때까지 대기 (scrollWidth가 변경되지 않을 때까지)
            let lastScrollWidth = 0;
            let stableCount = 0;
            const checkStability = () => {
                requestAnimationFrame(() => {
                    const currentScrollWidth = galleryWrapper.scrollWidth;
                    
                    if (currentScrollWidth === lastScrollWidth && currentScrollWidth > 0) {
                        stableCount++;
                        // 3번 연속 동일한 값이면 안정화된 것으로 간주
                        if (stableCount >= 3) {
                            applyScrollPosition();
                        } else {
                            setTimeout(checkStability, 50);
                        }
                    } else {
                        stableCount = 0;
                        lastScrollWidth = currentScrollWidth;
                        setTimeout(checkStability, 50);
                    }
                });
            };
            
            const applyScrollPosition = () => {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        const containerWidth = galleryContainer.clientWidth;
                        const wrapperWidth = galleryWrapper.scrollWidth;
                        
                        console.log('Container width:', containerWidth);
                        console.log('Wrapper scrollWidth:', wrapperWidth);
                        console.log('Image count:', imageCount);
                        console.log('Is mobile:', isMobile);
                        console.log('Is tablet:', isTablet);
                        
                        // 모든 디바이스에서 첫 번째 이미지(왼쪽 끝)부터 시작
                        galleryWrapper.style.marginLeft = '';
                        galleryWrapper.style.marginRight = '';
                        galleryContainer.scrollLeft = 0;
                        
                        console.log('Setting scroll position to start (scrollLeft = 0)');
                        
                        // 스크롤 위치 확인 및 재시도 (여러 번)
                        setTimeout(() => {
                            let attempts = 0;
                            const maxAttempts = 10;
                            
                            const checkAndRetry = () => {
                                const actualScroll = galleryContainer.scrollLeft;
                                
                                // 스크롤 위치가 제대로 설정되지 않았으면 재시도
                                if (actualScroll > 5 && attempts < maxAttempts) {
                                    attempts++;
                                    galleryContainer.scrollLeft = 0;
                                    setTimeout(checkAndRetry, 100);
                                } else {
                                    console.log('Scroll position set to start successfully');
                                }
                            };
                            
                            checkAndRetry();
                        }, 100);
                    });
                });
            };
            
            // 초기 대기 후 안정성 확인 시작
            setTimeout(() => {
                lastScrollWidth = galleryWrapper.scrollWidth;
                checkStability();
            }, totalDelay);
        }

        // 초기 렌더링
        renderGallery();

        // 리사이즈 시 갤러리 아이템 크기 조정 및 중앙 정렬 재적용
        function updateGalleryItemSizes() {
            const items = document.querySelectorAll('.gallery-item');
            const isPosterMode = document.body.classList.contains('poster-mode');
            
            items.forEach((item) => {
                // 포스터 모드는 CSS에서 처리하므로 스타일 제거
                if (isPosterMode) {
                    item.style.width = 'auto';
                    item.style.height = 'auto';
                    return;
                }
            });
            
            // 갤러리 모드에서 중앙 정렬 재적용
            if (!isPosterMode) {
                centerGalleryOnLoad();
            }
        }

        // 리사이즈 이벤트
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(updateGalleryItemSizes, 100);
        });
    </script>
