<!DOCTYPE html>
<html lang="ko">

<head>
    <script>document.title = 'archive';</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>archive</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Portfolio Archive">
    <meta property="og:title" content="archive">
    <meta property="og:description" content="Portfolio Archive">
    <meta property="og:image" content="../../../og-image.png">
    <link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #000000;
            --color-text: #ffffff;
            --color-accent: #00FFA3;
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
            --bg-transition: 0.8s;
        }

        html {
            font-size: 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar {
            display: none;
        }

        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-primary);
            line-height: 1.5;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        /* ===== Background Image Layers ===== */
        .bg-images {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
        }

        .bg-images__layer {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity var(--bg-transition) ease;

        }

        .bg-images__layer.active {
            opacity: 1;
        }

        .bg-images__overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: -1;
        }

        /* ===== Navigation Bar ===== */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1.25vw;
            z-index: 10002;
        }

        .nav-left {
            display: flex;
            align-items: center;
            position: relative;
        }

        .nav-back {
            font-size: max(16px, 0.833vw);
            font-weight: 400;
            letter-spacing: -0.01em;
            text-decoration: none;
            color: inherit;
            opacity: 0;
            cursor: pointer;
            white-space: nowrap;
            width: 0;
            margin-right: 0;
            overflow: hidden;
            pointer-events: none;
            transition: opacity 0.8s cubic-bezier(0.25, 0.1, 0.25, 1),
                width 0.8s cubic-bezier(0.25, 0.1, 0.25, 1),
                margin-right 0.8s cubic-bezier(0.25, 0.1, 0.25, 1),
                transform 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        body.loaded.can-go-back .nav-back,
        body.header-ready.can-go-back .nav-back {
            opacity: 1;
            width: auto;
            margin-right: 14px;
        }

        body.header-ready .nav-back {
            transition: none;
        }

        .nav-back:hover {
            opacity: 1;
            text-decoration: line-through;
        }

        body.can-go-back .nav-back {
            pointer-events: auto;
        }

        .top-bar.transitioning .nav-back {
            opacity: 0;
            width: 0;
            margin-right: 0;
            transform: translateX(-20px);
        }

        .nav-home {
            font-size: max(16px, 0.833vw);
            font-weight: 400;
            letter-spacing: -0.01em;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .nav-home:hover {
            text-decoration: line-through;
        }

        /* ===== Title & Description ===== */
        .title-container {
            position: fixed;
            top: 5vw;
            left: 1.25vw;
            z-index: 1001;
            max-width: 40vw;
            pointer-events: none;
        }

        .title-container .title {
            font-size: max(20px, 1.042vw);
            font-weight: 800;
            letter-spacing: 0;
            color: inherit;
            margin-bottom: calc(1vw - 5px);
            line-height: 1.2;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .title-container .title.animate {
            opacity: 1;
            transform: translateY(0);
        }

        .title-container .description {
            font-size: max(16px, 0.75vw);
            font-weight: 300;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: -0.01em;
            margin-top: -0.3vw;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s,
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
        }

        .title-container .description.animate {
            opacity: 1;
            transform: translateY(0);
        }

        .title-container .description .desc-line {
            display: block;
        }

        .title-container .hint {
            font-size: max(11px, 0.6vw);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.05em;
            margin-top: 1.2vw;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s,
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s;
        }

        .title-container .hint.animate {
            opacity: 1;
            transform: translateY(0);
        }

        .hint--mobile {
            display: none;
        }

        @media (max-width: 768px) {
            .hint--desktop {
                display: none;
            }

            .hint--mobile {
                display: block;
            }
        }

        /* ===== Word Scroll Main ===== */
        .looping-words-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: -1;
        }

        .looping-words {
            height: 0.9em;
            padding-left: 0.1em;
            padding-right: 0.1em;
            font-size: 11vw;
            line-height: 0.9;
            position: relative;
        }

        .looping-words__containers {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: visible;
        }

        .looping-words__list {
            text-align: center;
            text-transform: uppercase;
            white-space: nowrap;
            flex-flow: column;
            align-items: center;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            list-style: none;
            display: flex;
            position: relative;
        }

        .looping-words__item {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        .looping-words__p {
            margin: 0;
            line-height: 0.9;
        }

        /* Fade gradient mask (비활성) */
        .looping-words__fade {
            display: none;
        }

        /* Corner selector frame */
        .looping-words__selector {
            pointer-events: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
        }

        .looping-words__edge {
            border-top: 0.035em solid var(--color-accent);
            border-left: 0.035em solid var(--color-accent);
            width: 0.125em;
            height: 0.125em;
            position: absolute;
            top: 0;
            left: 0;
        }

        .looping-words__edge.is--2 {
            left: auto;
            right: 0;
            transform: rotate(90deg);
        }

        .looping-words__edge.is--3 {
            inset: auto 0 0 auto;
            transform: rotate(180deg);
        }

        .looping-words__edge.is--4 {
            top: auto;
            bottom: 0;
            transform: rotate(270deg);
        }

        /* ===== Loading ===== */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-bg);
            pointer-events: none;
            z-index: 10001;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            overflow: visible;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            transition: width 0.1s ease-out;
            position: relative;
        }

        .particle-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            pointer-events: none;
            background: #ffffff;
        }

        .particle.small {
            width: 4px;
            height: 4px;
        }

        .particle.large {
            width: 10px;
            height: 10px;
        }

        .particle.circle {
            border-radius: 50%;
        }

        .particle.square {
            border-radius: 0;
        }

        .particle.triangle {
            background: transparent !important;
            width: 0 !important;
            height: 0 !important;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 7px solid #ffffff;
        }

        .particle.triangle.small {
            border-left-width: 3px;
            border-right-width: 3px;
            border-bottom-width: 5px;
        }

        .particle.triangle.large {
            border-left-width: 6px;
            border-right-width: 6px;
            border-bottom-width: 10px;
        }

        .particle.star {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        .particle.diamond {
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }

        body.is-loading .looping-words-wrapper {
            opacity: 0;
        }

        body.loaded .loading {
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        body.loaded .looping-words-wrapper {
            opacity: 1;
            transition: opacity 0.6s ease 0.2s;
        }

        /* ===== Responsive - Tablet ===== */
        @media (max-width: 1024px) {
            .top-bar {
                padding: 3vw;
            }

            .nav-back {
                font-size: 2vw;
            }

            .nav-home {
                font-size: 2vw;
            }

            .title-container {
                top: 10vw;
                left: 3vw;
                max-width: none;
            }

            .title-container .title {
                white-space: normal;
            }

            .looping-words {
                font-size: 14vw;
            }
        }

        /* ===== Responsive - Mobile ===== */
        @media (max-width: 768px) {
            .top-bar {
                padding: 4vw;
            }

            .nav-back {
                font-size: 3.5vw;
            }

            .nav-home {
                font-size: 3.5vw;
            }

            .title-container {
                top: 14vw;
                left: 4vw;
            }

            .title-container .description .desc-line {
                white-space: normal;
            }

            .nav-back:hover,
            .nav-home:hover {
                text-decoration: none !important;
            }

            .looping-words {
                font-size: 16vw;
            }
        }

        /* ===== Responsive - Small Mobile ===== */
        @media (max-width: 480px) {
            .top-bar {
                padding: 5vw;
            }

            .nav-back {
                font-size: 4vw;
            }

            .nav-home {
                font-size: 4vw;
            }

            .title-container {
                top: 18vw;
                left: 5vw;
            }

            .nav-back:hover,
            .nav-home:hover {
                text-decoration: none !important;
            }

            .looping-words {
                font-size: 18vw;
            }
        }
    </style>
</head>

<body class="is-loading">
    <!-- Background Images -->
    <div class="bg-images" data-bg-container>
        <div class="bg-images__layer active" data-bg-index="0"></div>
        <div class="bg-images__layer" data-bg-index="1"></div>
        <div class="bg-images__layer" data-bg-index="2"></div>
        <div class="bg-images__layer" data-bg-index="3"></div>
        <div class="bg-images__layer" data-bg-index="4"></div>
        <div class="bg-images__layer" data-bg-index="5"></div>
        <div class="bg-images__layer" data-bg-index="6"></div>
        <div class="bg-images__layer" data-bg-index="7"></div>
        <div class="bg-images__layer" data-bg-index="8"></div>
        <div class="bg-images__layer" data-bg-index="9"></div>
    </div>
    <div class="bg-images__overlay"></div>
    <!-- Loading -->
    <div class="loading">
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <div class="particle-container"></div>
    </div>

    <!-- Navigation -->
    <header class="top-bar">
        <div class="nav-left">
            <a href="/" class="nav-back">← back</a>
            <a href="/" class="nav-home">home</a>
        </div>
    </header>

    <!-- Title & Description -->
    <div class="title-container">
        <h1 class="title">looping words</h1>
        <p class="description">
            <span class="desc-line">gsap vertical word loop animation.</span>
            <span class="desc-line">elastic easing with corner frame selector.</span>
        </p>
        <p class="hint hint--desktop">scroll or ↑↓ to navigate</p>
        <p class="hint hint--mobile">swipe to navigate</p>
    </div>

    <!-- Word Scroll Content -->
    <div class="looping-words-wrapper">
        <section class="looping-words">
            <div class="looping-words__containers">
                <ul data-looping-words-list class="looping-words__list">
                    <li class="looping-words__item">
                        <p class="looping-words__p">GSAP</p>
                    </li>
                    <li class="looping-words__item">
                        <p class="looping-words__p">Looping</p>
                    </li>
                    <li class="looping-words__item">
                        <p class="looping-words__p">Words</p>
                    </li>
                    <li class="looping-words__item">
                        <p class="looping-words__p">Selector</p>
                    </li>
                    <li class="looping-words__item">
                        <p class="looping-words__p">Elastic</p>
                    </li>
                    <li class="looping-words__item">
                        <p class="looping-words__p">Frame</p>
                    </li>
                    <li class="looping-words__item">
                        <p class="looping-words__p">Motion</p>
                    </li>
                    <li class="looping-words__item">
                        <p class="looping-words__p">Scroll</p>
                    </li>
                    <li class="looping-words__item">
                        <p class="looping-words__p">Archive</p>
                    </li>
                    <li class="looping-words__item">
                        <p class="looping-words__p">Design</p>
                    </li>
                </ul>
            </div>
            <div class="looping-words__fade"></div>
            <div data-looping-words-selector class="looping-words__selector">
                <div class="looping-words__edge"></div>
                <div class="looping-words__edge is--2"></div>
                <div class="looping-words__edge is--3"></div>
                <div class="looping-words__edge is--4"></div>
            </div>
        </section>
    </div>

    <script>
        // ===== Smart Back Button (그라운드룰) =====
        const navBack = document.querySelector('.nav-back');
        const topBar = document.querySelector('.top-bar');
        const loading = document.querySelector('.loading');
        const progressFill = document.querySelector('.progress-fill');
        const particleContainer = document.querySelector('.particle-container');
        let lastParticleTime = 0;
        let currentProgress = 0;
        let loadingFinished = false;

        const fromHome = sessionStorage.getItem('fromHome');
        const skipHeaderAnimation = !fromHome;

        if (fromHome) {
            sessionStorage.removeItem('fromHome');
            document.body.classList.add('can-go-back');
        }

        if (skipHeaderAnimation) {
            document.body.classList.add('header-ready');
        }

        // ===== Particle System =====
        const shapes = ['circle', 'square', 'triangle', 'star', 'diamond'];

        function createParticle(x) {
            if (!particleContainer) return;

            const particle = document.createElement('div');
            particle.className = 'particle';

            const rand = Math.random();
            if (rand > 0.8) particle.classList.add('large');
            else if (rand < 0.3) particle.classList.add('small');

            const shape = shapes[Math.floor(Math.random() * shapes.length)];
            particle.classList.add(shape);

            particle.style.background = '#ffffff';
            particle.style.left = x + 'px';
            particle.style.top = '2px';

            const vx = (Math.random() - 0.5) * 8;
            const vy = Math.random() * 6 + 2;
            const rotation = Math.random() * 360;
            const scale = 0.5 + Math.random() * 1;
            const lifetime = 800 + Math.random() * 1200;

            particle.style.transform = `scale(${scale}) rotate(${rotation}deg)`;
            particleContainer.appendChild(particle);

            let startTime = Date.now();
            let posX = x;
            let posY = 2;
            let velocityX = vx;
            let velocityY = vy;

            function animateParticle() {
                const elapsed = Date.now() - startTime;
                const prog = elapsed / lifetime;

                if (prog >= 1) {
                    particle.remove();
                    return;
                }

                velocityY += 0.15;
                posX += velocityX;
                posY += velocityY;

                const fadeOpacity = (1 - prog);
                const currentScale = scale * (1 - prog * 0.5);

                particle.style.left = posX + 'px';
                particle.style.top = posY + 'px';
                particle.style.opacity = fadeOpacity;
                particle.style.transform = `scale(${currentScale}) rotate(${rotation + elapsed * 0.2}deg)`;

                requestAnimationFrame(animateParticle);
            }

            requestAnimationFrame(animateParticle);
        }

        function createParticleBurst(x, count) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => createParticle(x), i * 20);
            }
        }

        function updateProgress(value) {
            currentProgress = Math.min(value, 100);
            if (progressFill) {
                progressFill.style.width = currentProgress + '%';

                // Create particles at the edge
                const now = Date.now();
                if (now - lastParticleTime > 15) {
                    // Use actual rendered width to sync with CSS transition
                    const x = progressFill.getBoundingClientRect().width;
                    createParticle(x);
                    createParticle(x);
                    if (Math.random() > 0.5) createParticle(x);
                    lastParticleTime = now;
                }
            }
        }

        // ===== Loading Flow =====
        function finishLoading() {
            if (loadingFinished) return;
            loadingFinished = true;

            createParticleBurst(window.innerWidth, 20);

            setTimeout(() => {
                document.body.classList.remove('is-loading');
                document.body.classList.add('loaded');

                // 타이틀/설명 등장 모션 트리거
                const titleElement = document.querySelector('.title-container .title');
                const descriptionElement = document.querySelector('.title-container .description');

                if (titleElement) {
                    requestAnimationFrame(() => {
                        titleElement.classList.add('animate');
                    });
                }

                if (descriptionElement) {
                    requestAnimationFrame(() => {
                        setTimeout(() => {
                            descriptionElement.classList.add('animate');
                        }, 100);
                    });
                }

                const hintElements = document.querySelectorAll('.title-container .hint');
                hintElements.forEach(hint => {
                    requestAnimationFrame(() => {
                        setTimeout(() => {
                            hint.classList.add('animate');
                        }, 300);
                    });
                });

                // Word loop 시작
                initLoopingWords();

                setTimeout(() => {
                    loading.style.display = 'none';
                }, 500);
            }, 300);
        }

        // 자동 로딩 시뮬레이션 (iframe 없으므로)
        let progressInterval = setInterval(() => {
            if (currentProgress < 90 && !loadingFinished) {
                updateProgress(currentProgress + 1);
            } else {
                clearInterval(progressInterval);
                // 90% 이후 가속 완료
                const completeInterval = setInterval(() => {
                    if (currentProgress < 100) {
                        updateProgress(currentProgress + 2);
                    } else {
                        clearInterval(completeInterval);
                        finishLoading();
                    }
                }, 20);
            }
        }, 30);

        // ===== Navigation =====
        const navHome = document.querySelector('.nav-home');

        function getHomePath() {
            const currentPath = window.location.pathname;
            const pathParts = currentPath.split('/').filter(p => p);
            const archiveIndex = pathParts.indexOf('archive');
            if (archiveIndex !== -1) {
                return '/' + pathParts.slice(0, archiveIndex + 1).join('/') + '/';
            }
            return '/';
        }

        const homePath = getHomePath();
        if (navBack) navBack.setAttribute('href', homePath);
        if (navHome) navHome.setAttribute('href', homePath);

        function navigateBack(e) {
            e.preventDefault();
            const homePath = getHomePath();
            topBar.classList.add('transitioning');
            setTimeout(() => {
                window.location.href = homePath;
            }, 600);
        }

        navBack.addEventListener('click', navigateBack);
        navHome.addEventListener('click', navigateBack);

        // ===== Looping Words Animation (GSAP) =====
        function initLoopingWords() {
            const wordList = document.querySelector('[data-looping-words-list]');
            const edgeElement = document.querySelector('[data-looping-words-selector]');
            const allItems = Array.from(wordList.children);
            const totalItems = allItems.length;
            const wordHeight = 100 / totalItems;
            let currentIndex = 0;

            // 배경 이미지 초기화 (랜덤 placeholder)
            const bgLayers = document.querySelectorAll('.bg-images__layer');
            bgLayers.forEach((layer, i) => {
                layer.style.backgroundImage = `url('https://picsum.photos/1920/1080?random=${i + 1}')`;
            });

            // 배경 이미지 전환
            function switchBackground(idx) {
                bgLayers.forEach(layer => layer.classList.remove('active'));
                if (bgLayers[idx]) bgLayers[idx].classList.add('active');
            }

            function updateEdgeWidth(targetIdx) {
                const idx = (targetIdx !== undefined ? targetIdx : currentIndex) % totalItems;
                const centerWord = allItems[idx];
                const centerWordWidth = centerWord.getBoundingClientRect().width;
                const listWidth = wordList.getBoundingClientRect().width;
                const percentageWidth = (centerWordWidth / listWidth) * 100;
                gsap.to(edgeElement, {
                    width: `${percentageWidth}%`,
                    duration: 0.5,
                    ease: 'expo.out',
                });
                switchBackground(idx);
            }

            let isAnimating = false;

            function moveWords() {
                if (isAnimating || currentIndex >= totalItems - 1) return;
                isAnimating = true;
                currentIndex++;

                gsap.to(wordList, {
                    yPercent: -wordHeight * currentIndex,
                    duration: 0.6,
                    ease: 'power3.out',
                    onStart: () => updateEdgeWidth(currentIndex),
                    onComplete: () => { isAnimating = false; },
                });
            }

            function moveWordsUp() {
                if (isAnimating || currentIndex <= 0) return;
                isAnimating = true;
                currentIndex--;

                gsap.to(wordList, {
                    yPercent: -wordHeight * currentIndex,
                    duration: 0.6,
                    ease: 'power3.out',
                    onStart: () => updateEdgeWidth(currentIndex),
                    onComplete: () => { isAnimating = false; },
                });
            }

            // 마우스 휠로 조작
            document.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY > 0) {
                    moveWords();
                } else {
                    moveWordsUp();
                }
            }, { passive: false });

            // 키보드로 조작 (ArrowDown/ArrowUp)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown' || e.key === ' ') {
                    e.preventDefault();
                    moveWords();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    moveWordsUp();
                }
            });

            // 모바일 터치 스와이프
            let touchStartY = 0;
            let touchStartTime = 0;

            document.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
                touchStartTime = Date.now();
            }, { passive: true });

            document.addEventListener('touchend', (e) => {
                const deltaY = touchStartY - e.changedTouches[0].clientY;
                const deltaTime = Date.now() - touchStartTime;
                const minDistance = 30;
                const maxTime = 500;

                if (Math.abs(deltaY) > minDistance && deltaTime < maxTime) {
                    if (deltaY > 0) {
                        moveWords();
                    } else {
                        moveWordsUp();
                    }
                }
            }, { passive: true });

            // 초기 프레임 너비 설정
            updateEdgeWidth();
        }
    </script>
</body>

</html>
